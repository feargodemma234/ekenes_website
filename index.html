<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Empire Zone | Daily Contribution</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for a modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cool Animated Background -->
    <div class="glow-bg">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">E</div>
            <h1>The Empire Zone</h1>
            <p class="subtitle">Daily Contribution Portal</p>
        </header>

        <!-- Payment Card -->
        <div class="glass-card main-card">
            <div class="badge">Official Account</div>
            
            <p class="instruction">Send your daily contribution to:</p>
            
            <!-- Account Number with Tap to Copy -->
            <div class="account-box" onclick="copyAccountNumber()">
                <span id="account-number">935704</span>
                <span class="copy-icon" id="copy-text">Tap to Copy</span>
            </div>
            
            <!-- Primary Action: Send Receipt -->
            <button class="btn-primary" onclick="sendWhatsAppReceipt()">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                Send Payment Receipt
            </button>
        </div>

        <!-- Community Card -->
        <div class="glass-card community-card">
            <h2>Join the Community</h2>
            <p>Stay updated with announcements and daily updates.</p>
            <a href="https://chat.whatsapp.com/YOUR_GROUP_LINK" class="btn-secondary" target="_blank">
                Enter WhatsApp Group
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
